name: Release check

# Pull requests into master are releases: merging one publishes a GitHub release (release.yml). They must come from
# this repository's development branch and carry a version higher than every release so far.
on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
    - name: Comes from development
      env:
        HEAD_REF: ${{ github.head_ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        THIS_REPO: ${{ github.repository }}
      run: |
        if [ "$HEAD_REF" != "development" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
          echo "::error::Releases come from development. Open this pull request from $THIS_REPO's development branch (this one is from $HEAD_REPO:$HEAD_REF)."
          exit 1
        fi

    - uses: actions/checkout@v4
      with:
        # The tags, to compare with the latest release
        fetch-depth: 0

    - name: Version is higher than the latest release
      run: node tools/check-version.mjs --bumped
