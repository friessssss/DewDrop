name: Build

on:
  push:
    branches: [ "development" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Build DewDrop.Core
      run: dotnet build DewDrop.Core/DewDrop.Core.csproj
    - name: Test DewDrop.Core
      run: dotnet test DewDrop.Core.Tests/DewDrop.Core.Tests.csproj

  # The mod itself, built and packaged exactly as a release is (release.yml), against metadata-only copies of the
  # game's and SMAPI's DLLs since the runner has no game install. The zips are attached to the run for testing.
  build-mod:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # Pinned to a commit; when the game or SMAPI updates, see docs/contributing/releasing.md.
    - name: Get the Stardew Valley and SMAPI reference assemblies
      uses: actions/checkout@v4
      with:
        repository: StardewModders/mod-reference-assemblies
        ref: 0141355fecb8536715ecff22f99374b5e632cbed
        path: .game-refs
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Check the version
      run: node tools/check-version.mjs
    - name: Build and package
      run: node tools/package-release.mjs --game-path="$GITHUB_WORKSPACE/.game-refs"
    - name: Attach the zips
      uses: actions/upload-artifact@v4
      with:
        name: DewDrop-zips
        path: artifacts/release/

  # The macOS/Linux installer, on Linux and on macOS (which ships bash 3.2).
  installer-unix:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Check script syntax
      run: |
        /bin/bash -n installer/internal/install.sh
        /bin/bash -n "installer/Install on Linux.sh"
        /bin/bash -n "installer/Install on macOS.command"
    - name: Test install.sh
      run: /bin/bash installer/tests/install-sh.test.sh

  installer-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check install.ps1 parses in Windows PowerShell and is plain ASCII
      shell: powershell
      run: |
        $errors = $null
        [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\installer\internal\install.ps1", [ref]$null, [ref]$errors)
        if ($errors) { $errors; exit 1 }
        if ([IO.File]::ReadAllBytes("$PWD\installer\internal\install.ps1") | Where-Object { $_ -gt 127 }) { 'install.ps1 must be plain ASCII'; exit 1 }
    - name: Test install.ps1
      shell: powershell
      run: .\installer\tests\install-ps1.test.ps1
