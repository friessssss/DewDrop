name: Build

on:
  push:
    branches: [ "development" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    # DewDrop.Mod needs a Stardew Valley install to build, so CI only builds the game-independent library.
    - name: Build DewDrop.Core
      run: dotnet build DewDrop.Core/DewDrop.Core.csproj
